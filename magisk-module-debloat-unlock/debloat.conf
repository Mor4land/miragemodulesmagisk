# ==============================================================================
# Mirage POCO M5 Debloat & Feature Unlocker Configuration
# Путь в системе: /data/adb/mirage_pocom5_debloat.conf
# 1 = Включено / Разблокировано / Отключено, 0 = Пропустить
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. РАЗБЛОКИРОВКА ФУНКЦИЙ ДЛЯ БЮДЖЕТНОГО ЖЕЛЕЗА (FEATURE UNLOCKS)
# ------------------------------------------------------------------------------
# Настоящее Gaussian размытие шторки / Центра Управления (убирает серый фон)
UNLOCK_REAL_BLUR=1

# Плавающие окна (Freeform / Floating Windows) в недавних задачах и шторке
UNLOCK_FREEFORM=1

# Боковая панель (Smart Toolbox / Sidebar) во всех приложениях и играх
UNLOCK_SIDEBAR=1

# Расширенные функции Game Turbo (меню настроек, игровой оверлей)
UNLOCK_GAME_TURBO=1

# Sound Assistant (раздельная регулировка громкости для разных приложений)
UNLOCK_SOUND_ASSIST=1

# Фиксация 90 Гц (блокировка сброса герцовки в 60 Гц через Joyose/Powerkeeper)
LOCK_90HZ_SMOOTHNESS=1

# ------------------------------------------------------------------------------
# 2. БЛОКИРОВКА РЕКЛАМЫ И ТЕЛЕМЕТРИИ (AD & TELEMETRY BLOCKING)
# ------------------------------------------------------------------------------
# Отключение системного рекламного демона MIUI (MSA)
DISABLE_MIUI_ADS=1

# Отключение Xiaomi Analytics, телеметрии, сбора статистики и отчетов об ошибках
DISABLE_ANALYTICS=1

# Системлесс hosts файл (/system/etc/hosts) для блокировки рекламных серверов Xiaomi
ENABLE_HOSTS_ADBLOCK=1

# ------------------------------------------------------------------------------
# 3. БЕЗОПАСНЫЙ ДЕБЛОАТ ПРИЛОЖЕНИЙ (SYSTEM DEBLOAT)
# ------------------------------------------------------------------------------
# Рекламная «Карусель обоев» (Glance / Wallpaper Carousel) на экране блокировки
DEBLOAT_CAROUSEL=1

# Магазин GetApps (Mi Picks) и Xiaomi Games
DEBLOAT_GETAPPS=1

# Встроенный Mi Browser (заменяется Chrome, Firefox, Brave и др.)
DEBLOAT_MI_BROWSER=1

# Mi Video (рекламный комбайн, заменяется VLC, MX Player и др.)
DEBLOAT_MI_VIDEO=1

# Mi Music (рекламный комбайн со стримингом)
DEBLOAT_MI_MUSIC=1

# Встроенный рекламный сканер CleanMaster внутри приложения Безопасность
DEBLOAT_CLEANMASTER=1

# Желтые страницы (база телефонных номеров и телеметрия звонков MIUI)
DEBLOAT_YELLOW_PAGES=1

# Предустановленные службы Facebook (Katana, App Installer, App Manager, Services)
DEBLOAT_FACEBOOK=1

# Предустановленный партнерский мусор (TikTok, AliExpress, Booking, eBay, Netflix stub, WPS)
DEBLOAT_PARTNER_APPS=1

# Ненужные сервисы Google (Google TV, Google Meet, Google Podcasts, Google News, One)
DEBLOAT_GOOGLE_BLOAT=1
